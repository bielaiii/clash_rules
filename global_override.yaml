# Clash Verge Rev 全局扩展覆写配置
#
# 与 global_script.js 一起使用：
# - 本文件负责固定配置、DNS、TUN、规则集和分流规则
# - global_script.js 负责根据当前订阅动态生成策略组
#
# 订阅地址不要写在这里，直接在 Clash Verge Rev 中添加你的订阅。

mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
external-controller: 127.0.0.1:9090

profile:
  store-selected: true
  store-fake-ip: true

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - any:53
    - tcp://any:53

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - localhost.ptlogin2.qq.com
    - '*.msftconnecttest.com'
    - '*.msftncsi.com'
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

# 预校验占位组：Clash Verge Rev 可能在执行 global_script.js 前先校验 rules。
# global_script.js 执行后会用动态节点组完整替换这一段；这些占位组本身不互相引用。
