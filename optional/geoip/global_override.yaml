rules:
  # 本地规则和广告规则优先级最高。
  - RULE-SET,LocalWhitelist,DIRECT
  - RULE-SET,LocalBlacklist,🧱 黑名单
  - RULE-SET,LocalDirect,DIRECT
  - RULE-SET,LocalProxy,🚀 节点选择
  - RULE-SET,Advertising,REJECT

  # 明确指定的网站规则，作为 GeoSite 的补充和保险。
  - DOMAIN-SUFFIX,patreon.com,🌐 常见外国网页
  - DOMAIN-SUFFIX,patreonusercontent.com,🌐 常见外国网页
  - DOMAIN-SUFFIX,discord.com,🌐 常见外国网页
  - DOMAIN-SUFFIX,discordapp.com,🌐 常见外国网页
  - DOMAIN-SUFFIX,discordapp.net,🌐 常见外国网页
  - DOMAIN-SUFFIX,discord.gg,🌐 常见外国网页
  - DOMAIN-SUFFIX,pixiv.net,🌐 常见外国网页
  - DOMAIN-SUFFIX,pixivision.net,🌐 常见外国网页
  - DOMAIN-SUFFIX,pximg.net,🌐 常见外国网页
  - DOMAIN-SUFFIX,fanbox.cc,🌐 常见外国网页
  - DOMAIN-SUFFIX,wnacg.com,🌐 常见外国网页
  - DOMAIN-SUFFIX,wnacg.org,🌐 常见外国网页
  - DOMAIN-SUFFIX,wnacg.net,🌐 常见外国网页
  - DOMAIN-SUFFIX,mediafire.com,🌐 常见外国网页
  - DOMAIN-SUFFIX,mediafireusercontent.com,🌐 常见外国网页
  - DOMAIN-SUFFIX,misskon.com,🌐 常见外国网页
  - DOMAIN-SUFFIX,github.com,🌐 常见外国网页
  - DOMAIN-SUFFIX,githubusercontent.com,🌐 常见外国网页
  - DOMAIN-SUFFIX,githubassets.com,🌐 常见外国网页
  - DOMAIN-SUFFIX,github.io,🌐 常见外国网页
  - DOMAIN-SUFFIX,github.dev,🌐 常见外国网页
  - DOMAIN-SUFFIX,github.blog,🌐 常见外国网页
  - DOMAIN-SUFFIX,github.community,🌐 常见外国网页
  - DOMAIN-SUFFIX,githubstatus.com,🌐 常见外国网页

  # 服务规则优先于通用 GeoSite 规则。
  - RULE-SET,OpenAI,🇺🇸 美国地区
  - RULE-SET,Google,🌐 常见外国网页
  - RULE-SET,Microsoft,Ⓜ️ Microsoft
  - RULE-SET,Apple,🍎 Apple
  - RULE-SET,Telegram,📲 Telegram
  - RULE-SET,YouTube,📺 YouTube
  - RULE-SET,Steam,🎮 Steam

  # 通用分类：不再要求把每个外国网站手写进配置。
  - RULE-SET,ChinaMax,🇨🇳 中国大陆
  - GEOSITE,private,DIRECT
  - GEOSITE,CN,🇨🇳 中国大陆
  - GEOIP,CN,🇨🇳 中国大陆,no-resolve
  - GEOSITE,geolocation-!cn,🌐 常见外国网页

  # 这些规则主要处理直接访问 IP 的流量；no-resolve 避免为普通域名额外解析。
  - GEOIP,US,🇺🇸 美国地区,no-resolve
  - GEOIP,JP,🇯🇵 日本地区,no-resolve
  - GEOIP,SG,🇸🇬 新加坡地区,no-resolve
  - GEOIP,HK,🇭🇰 香港地区,no-resolve
  - GEOIP,TW,🇹🇼 台湾地区,no-resolve
  - MATCH,🐟 漏网之鱼
