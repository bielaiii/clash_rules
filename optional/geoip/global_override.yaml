# 可选 GeoIP / GeoSite 增强版全局扩展配置
#
# 使用方法：
# 1. 用本文件替换根目录的 global_override.yaml；不要同时启用两个版本。
# 2. 继续使用根目录的 global_script.js。
# 3. 如果客户端缓存过 geoip-lite.dat，请先在客户端更新 GEO 数据库。
#
# 分流思路：域名优先使用 GeoSite 做大陆/非大陆分类；只有已经是 IP 的请求
# 才使用 GEOIP 做国家地区分类。这样 Gmail、Outlook、Steam 以及未手写的
# 外国网站不需要逐个补域名，未命中时才进入“漏网之鱼”。

mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
external-controller: 127.0.0.1:9090

profile:
  store-selected: true
  store-fake-ip: true

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - any:53
    - tcp://any:53

geodata-mode: true
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat
  geosite: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
  mmdb: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - localhost.ptlogin2.qq.com
    - '*.msftconnecttest.com'
    - '*.msftncsi.com'
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32

# 预校验占位组；global_script.js 执行后会替换为动态节点组。
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies: [DIRECT]
  - name: 📶 手动测速
    type: select
    proxies: [DIRECT]
  - name: 🌐 常见外国网页
    type: select
    proxies: [DIRECT]
  - name: 🤖 OpenAI
    type: select
    proxies: [DIRECT]
  - name: Ⓜ️ Microsoft
    type: select
    proxies: [DIRECT]
  - name: 🍎 Apple
    type: select
    proxies: [DIRECT]
  - name: 📲 Telegram
    type: select
    proxies: [DIRECT]
  - name: 📺 YouTube
    type: select
    proxies: [DIRECT]
  - name: 🎮 Steam
    type: select
    proxies: [DIRECT]
  - name: 🇨🇳 中国大陆
    type: select
    proxies: [DIRECT]
  - name: 🐟 漏网之鱼
    type: select
    proxies: [DIRECT]
  - name: 🇺🇸 美国地区
    type: select
    proxies: [DIRECT]
  - name: 🇯🇵 日本地区
    type: select
    proxies: [DIRECT]
  - name: 🇸🇬 新加坡地区
    type: select
    proxies: [DIRECT]
  - name: 🇭🇰 香港地区
    type: select
    proxies: [DIRECT]
  - name: 🇹🇼 台湾地区
    type: select
    proxies: [DIRECT]
  - name: 🧱 黑名单
    type: select
    proxies: [REJECT, DIRECT]

