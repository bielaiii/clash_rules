# 可选 GeoIP / GeoSite 增强版全局扩展配置
#
# 本文件是 GeoIP 覆写配置源模板。需要从 config/subscription.env 加入机场时，
# 运行 scripts/render_override.py，并将生成的 dist/global_override.yaml 导入客户端。
# 始终同时使用仓库根目录的 global_script.js。
#
# 分流思路：域名优先使用 GeoSite 做大陆/非大陆分类；只有已经是 IP 的请求
# 才使用 GEOIP 做国家地区分类。这样 Gmail、Outlook、Steam 以及未手写的
# 外国网站不需要逐个补域名，未命中时才进入“漏网之鱼”。

mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
external-controller: 127.0.0.1:9090

profile:
  store-selected: true
  store-fake-ip: true

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - any:53
    - tcp://any:53

# 浏览器自行解析 DNS 时，从 HTTP/TLS/QUIC 恢复域名用于分流。
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

geodata-mode: true
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat
  geosite: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
  mmdb: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb

dns:
  enable: true
  ipv6: false
  prefer-h3: false
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - localhost.ptlogin2.qq.com
    - '*.msftconnecttest.com'
    - '*.msftncsi.com'
  # 节点域名必须独立直连解析，避免“先连代理才能解析代理节点”的循环。
  proxy-server-nameserver:
    - 'https://223.5.5.5/dns-query#DIRECT'
    - 'https://doh.pub/dns-query#DIRECT'
  direct-nameserver:
    - 'https://223.5.5.5/dns-query#DIRECT'
    - 'https://doh.pub/dns-query#DIRECT'
  nameserver-policy:
    'geosite:cn,private':
      - 'https://223.5.5.5/dns-query#DIRECT'
      - 'https://doh.pub/dns-query#DIRECT'
  # 其余域名通过代理查询境外 DoH，不再混用国内/国外 fallback。
  # 显式清空订阅可能带入的旧 fallback。
  fallback: []
  nameserver:
    - 'https://1.1.1.1/dns-query#🚀 节点选择'
    - 'https://8.8.8.8/dns-query#🚀 节点选择'

# 由生成脚本插入机场订阅 provider。
# __GENERATED_PROXY_PROVIDERS__

# 预校验占位组；global_script.js 执行后会替换为动态节点组。
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies: [DIRECT]
  - name: 📶 手动测速
    type: select
    proxies: [DIRECT]
  - name: 🌐 常见外国网页
    type: select
    proxies: [DIRECT]
  - name: 网站分流
    type: select
    proxies: [DIRECT]
  - name: 🤖 OpenAI
    type: select
    proxies: [DIRECT]
  - name: Ⓜ️ Microsoft
    type: select
    proxies: [DIRECT]
  - name: 🍎 Apple
    type: select
    proxies: [DIRECT]
  - name: 📲 Telegram
    type: select
    proxies: [DIRECT]
  - name: 📺 YouTube
    type: select
    proxies: [DIRECT]
  - name: 🎮 Steam
    type: select
    proxies: [DIRECT]
  - name: 🇨🇳 中国大陆
    type: select
    proxies: [DIRECT]
  - name: 🐟 漏网之鱼
    type: select
    proxies: [DIRECT]
  - name: 🇺🇸 美国地区
    type: select
    proxies: [DIRECT]
  - name: 🇯🇵 日本地区
    type: select
    proxies: [DIRECT]
  - name: 🇸🇬 新加坡地区
    type: select
    proxies: [DIRECT]
  - name: 🇭🇰 香港地区
    type: select
    proxies: [DIRECT]
  - name: 🇹🇼 台湾地区
    type: select
    proxies: [DIRECT]
  - name: 🧱 黑名单
    type: select
    proxies: [REJECT, DIRECT]

